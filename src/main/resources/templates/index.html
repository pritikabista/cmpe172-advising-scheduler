<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>

<h1>SJSU Campus Advising</h1>
<p>Book a meeting with an academic advisor.</p>

<h2>Advising Services</h2>
<table>
    <tr><th>Service</th><th>Description</th><th>Length</th><th></th></tr>
    <tr th:each="s : ${services}">
        <td th:text="${s.name}"></td>
        <td th:text="${s.description}"></td>
        <td th:text="${s.durationMinutes} + ' min'"></td>
        <td><a th:href="@{/slots(serviceId=${s.id})}">See slots</a></td>
    </tr>
</table>

<p><a th:href="@{/slots}">View all available slots &rarr;</a></p>
</body>
</html>
