spring.application.name=scheduler

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appointments}
spring.datasource.username=${DB_USER:appt}
spring.datasource.password=${DB_PASSWORD:appt}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Never send stack traces or exception details to the browser
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

logging.level.edu.sjsu.scheduler=INFO
