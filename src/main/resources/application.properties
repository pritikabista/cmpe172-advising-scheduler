spring.application.name=scheduler

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appointments}
spring.datasource.username=${DB_USER:appt}
spring.datasource.password=${DB_PASSWORD:appt}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Never send stack traces or exception details to the browser
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

logging.level.edu.sjsu.scheduler=INFO

# Fail fast if the database is down (used by GET /health), instead of waiting 30 s
spring.datasource.hikari.connection-timeout=5000

# --- Milestone 3: notification service (distribution boundary) ---
# The mock runs inside this app under /mock-notify. Point NOTIFICATION_BASE_URL elsewhere for a real service.
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:${local.server.port:${server.port:8080}}/mock-notify}
notification.connect-timeout-ms=500
notification.read-timeout-ms=1000
notification.max-attempts=3
notification.backoff-ms=200
# Retry job for queued (failed) notifications: every 60 s, give up after 10 rounds
notification.retry-job.delay-ms=60000
notification.retry-job.max-rounds=10

# Mock notification service: UP, DOWN (503) or SLOW (answers after slow-delay-ms)
mock-notify.mode=${MOCK_NOTIFY_MODE:UP}
mock-notify.slow-delay-ms=3000

# --- Milestone 3: observability ---
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
