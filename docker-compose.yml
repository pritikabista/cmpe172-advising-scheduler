# Runs the whole system: PostgreSQL + the Spring Boot app.
#   docker compose up --build      -> http://localhost:8080
#   docker compose down            -> stop (add -v to also delete the database volume)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appt
      POSTGRES_PASSWORD: appt
      POSTGRES_DB: appointments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appt -d appointments"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port on purpose: only the app talks to the DB (inside the compose network),
    # and it won't clash with a local appt-db container on 5432.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy   # start the app only after Postgres is ready
    environment:
      DB_URL: jdbc:postgresql://db:5432/appointments
      DB_USER: appt
      DB_PASSWORD: appt
      TZ: America/Los_Angeles
      # Milestone 4: Gemini key comes from your local .env file (never committed)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  pgdata:
